<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#090714" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="intenseGlow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)" />
  <rect width="496" height="496" x="2" y="2" rx="34" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.35" />

  <!-- Abstract Cyber Geometric Grid & Nodes -->
  <g opacity="0.25">
    <circle cx="250" cy="250" r="180" fill="none" stroke="#a855f7" stroke-dasharray="6,8" stroke-width="1.5" />
    <circle cx="250" cy="250" r="140" fill="none" stroke="#c084fc" stroke-width="1" />
    <circle cx="250" cy="250" r="215" fill="none" stroke="#ec4899" stroke-dasharray="3,12" stroke-width="1" />
  </g>

  <!-- Glowing Aura behind head -->
  <circle cx="250" cy="210" r="110" fill="#a855f7" opacity="0.22" filter="url(#intenseGlow)" />

  <!-- Developer Silhouette / Stylized Avatar Body -->
  <!-- Shoulders & Hoodie -->
  <path d="M120 460 C120 370, 180 340, 250 340 C320 340, 380 370, 380 460 Z" fill="#18122B" stroke="#a855f7" stroke-width="2" />
  <!-- Hoodie inner shadow/lapel -->
  <path d="M190 345 L250 440 L310 345" fill="none" stroke="url(#neonPurple)" stroke-width="3" stroke-linecap="round" />
  <path d="M210 390 L290 390" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.7" />

  <!-- Neck -->
  <rect x="225" y="280" width="50" height="70" rx="10" fill="#2d1b4e" />

  <!-- Head / Face -->
  <path d="M185 200 C185 140, 315 140, 315 200 C315 270, 275 305, 250 305 C225 305, 185 270, 185 200 Z" fill="#24173d" stroke="#c084fc" stroke-width="2" />

  <!-- Cybernetic Glasses / Neon Visor -->
  <g filter="url(#neonBlur)">
    <rect x="180" y="190" width="140" height="34" rx="10" fill="#090714" stroke="url(#neonPurple)" stroke-width="3" />
    <!-- Visor Lens Glow -->
    <path d="M186 195 L314 195 L310 219 L190 219 Z" fill="url(#neonPink)" opacity="0.85" />
    <!-- Code reflection scanlines -->
    <line x1="200" y1="203" x2="240" y2="203" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" />
    <line x1="260" y1="203" x2="285" y2="203" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <line x1="210" y1="211" x2="295" y2="211" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Modern Hair -->
  <path d="M175 185 C175 110, 230 95, 270 95 C320 95, 330 130, 325 170 C310 150, 290 145, 260 145 C220 145, 190 160, 175 185 Z" fill="#130b24" stroke="#a855f7" stroke-width="2" />
  <path d="M220 100 Q260 85 290 105" fill="none" stroke="url(#neonPurple)" stroke-width="3" stroke-linecap="round" filter="url(#neonBlur)" />

  <!-- Headphones -->
  <rect x="165" y="180" width="22" height="50" rx="10" fill="#0d0818" stroke="#a855f7" stroke-width="2.5" />
  <rect x="313" y="180" width="22" height="50" rx="10" fill="#0d0818" stroke="#a855f7" stroke-width="2.5" />
  <path d="M175 180 C175 100, 325 100, 325 180" fill="none" stroke="#7e22ce" stroke-width="6" stroke-linecap="round" />

  <!-- Floating Python Code Symbols / Badges -->
  <g filter="url(#neonBlur)">
    <!-- Python Brackets -->
    <text x="60" y="160" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="bold" fill="#c084fc">{ def }</text>
    <text x="360" y="170" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="bold" fill="#ec4899">&lt; / &gt;</text>
    <text x="80" y="320" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="bold" fill="#38bdf8">async</text>
    <text x="370" y="330" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="bold" fill="#a855f7">lambda</text>
  </g>

  <!-- Terminal badge at bottom -->
  <rect x="150" y="445" width="200" height="34" rx="8" fill="#0f0c1b" stroke="#a855f7" stroke-width="1.5" />
  <circle cx="168" cy="462" r="4" fill="#22c55e" />
  <text x="184" y="468" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0" font-weight="600">python: v3.12 active</text>
</svg>
